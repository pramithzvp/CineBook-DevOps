spring.application.name=cinebook-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cinebook_db}
spring.datasource.username=${DB_USERNAME:${DB_USER}}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
cinebook.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
server.servlet.session.cookie.name=CINEBOOK_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
server.address=${SERVER_ADDRESS:127.0.0.1}
